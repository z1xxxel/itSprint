spring.datasource.url=jdbc:postgresql://localhost:5432/sprint
spring.datasource.username=postgres
spring.datasource.password=qwer
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=${PORT:8080}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
# Лимиты переводов
tms.limits.peer.daily-per-recipient=50
tms.limits.peer.daily-total=200
tms.limits.manager.daily-per-subordinate=500
tms.limits.manager.daily-total=2000
# Сделать так, чтобы Swagger UI автоматически сворачивал/разворачивал модели
springdoc.swagger-ui.doc-expansion=list

# Включить кнопку "Try it out" по умолчанию (чтобы сразу можно было тестировать)
springdoc.swagger-ui.try-it-out-enabled=true

# Отсортировать эндпоинты по алфавиту
springdoc.swagger-ui.operations-sorter=alpha

# Настройка заголовка страницы
springdoc.swagger-ui.path=/swagger-ui.html
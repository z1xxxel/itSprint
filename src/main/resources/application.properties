server.port=${PORT:8080}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Лимиты переводов
# Лимиты переводов
# P2P между сотрудниками (было 50 / 200)
tms.limits.peer.daily-per-recipient=1000
tms.limits.peer.daily-total=1000

# Лимиты менеджеров (для бонусов)
tms.limits.manager.daily-per-subordinate=2000
tms.limits.manager.daily-total=5000
# Сделать так, чтобы Swagger UI автоматически сворачивал/разворачивал модели
springdoc.swagger-ui.doc-expansion=list

# Включить кнопку "Try it out" по умолчанию (чтобы сразу можно было тестировать)
springdoc.swagger-ui.try-it-out-enabled=true

# Отсортировать эндпоинты по алфавиту
springdoc.swagger-ui.operations-sorter=alpha

# Настройка заголовка страницы
springdoc.swagger-ui.path=/swagger-ui.html
# Значения по умолчанию для локального запуска (в IDE)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sprint}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:qwer}

# Настройки Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

# Отключаем open-in-view для избежания проблем с ленивой загрузкой
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB